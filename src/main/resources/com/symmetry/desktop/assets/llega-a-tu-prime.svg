<?xml version="1.0" encoding="UTF-8"?>
<!--
  Llega a tu Prime - Isotipo oficial (fuente vectorial maestra).
  Escudo de esquinas redondeadas con degradado azul de marca y tres simbolos en blanco:
  la figura humana en carrera (avance y disciplina), la flecha ascendente (progreso y
  rendimiento) y la cordillera (metas y llegar a la cima).
  Se reproduce de forma identica en la interfaz mediante com.symmetry.desktop.util.MarcaApp.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512" role="img"
     aria-label="Llega a tu Prime">
    <defs>
        <linearGradient id="primeAzul" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0.0" stop-color="#2AA9F0"/>
            <stop offset="0.55" stop-color="#0078D4"/>
            <stop offset="1.0" stop-color="#0A3D7A"/>
        </linearGradient>
    </defs>

    <!-- Escudo -->
    <rect x="0" y="0" width="48" height="48" rx="14.4" ry="14.4" fill="url(#primeAzul)"/>

    <!-- Cordillera (fondo sutil) -->
    <path d="M3,37 L13,24 L20,31 L30,19 L45,37 Z" fill="#FFFFFF" fill-opacity="0.22"/>

    <!-- Flecha ascendente -->
    <path d="M31,31 L44,15 M37,15 L44,15 L44,22" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.92" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Figura humana en carrera -->
    <path transform="translate(2,6) scale(1.3)" fill="#FFFFFF"
          d="M13.49,5.48c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z
             M9.89,19.38l1,-4.4 2.1,2v6h2v-7.5l-2.1,-2 0.6,-3c1.3,1.5 3.3,2.5 5.5,2.5v-2
             c-1.9,0 -3.5,-1 -4.3,-2.4l-1,-1.6c-0.4,-0.6 -1,-1 -1.7,-1 -0.3,0 -0.5,0.1 -0.8,0.1
             l-5.2,2.2v4.7h2v-3.4l1.8,-0.7 -1.6,8.1 -4.9,-1 -0.4,2 7,1.4z"/>
</svg>
