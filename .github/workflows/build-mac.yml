name: Instalador macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  construir:
    name: macOS ${{ matrix.arquitectura }}
    runs-on: ${{ matrix.ejecutor }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ejecutor: macos-latest
            arquitectura: arm64
          - ejecutor: macos-15-intel
            arquitectura: x64
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Construir el instalador
        run: bash empaquetado/build-mac.sh

      - name: Publicar el resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LlegaATuPrime-macOS-${{ matrix.arquitectura }}
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
            dist-mac/*.sha256
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Adjuntar a la publicacion
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Crear o actualizar la publicacion
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
